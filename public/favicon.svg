<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Solid dark squircle background for browser tab contrast -->
  <rect x="1" y="1" width="38" height="38" rx="9" fill="#141417" stroke="#27272A" stroke-width="1.2" />

  <!-- Electric Indigo Code Brackets < > (#6366F1) -->
  <path d="M 12.5 11 L 6 20 L 12.5 29" stroke="#6366F1" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 27.5 11 L 34 20 L 27.5 29" stroke="#6366F1" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Emerald Track Path & Checkmark Graphic with Arrow Peak (#10B981) -->
  <path d="M 15 19.5 L 19.5 24 L 27 12" stroke="#10B981" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 22.5 12 H 27 V 16.5" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Track link to base data nodes -->
  <line x1="19.5" y1="24" x2="19.5" y2="28" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" />

  <!-- Small Connecting Square Data Nodes at Base (DSA representation) -->
  <line x1="14" y1="28.5" x2="25" y2="28.5" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" />
  <rect x="12.5" y="27" width="3" height="3" rx="0.5" fill="#6366F1" />
  <rect x="18" y="27" width="3" height="3" rx="0.5" fill="#10B981" />
  <rect x="23.5" y="27" width="3" height="3" rx="0.5" fill="#6366F1" />
</svg>
